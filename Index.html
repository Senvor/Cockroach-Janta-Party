<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CJP</title>
    <!-- Google Font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
     <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
            body{
                background:#f0cea2;
                font-family: 'Inter', sans-serif;
                color:black;
            }
            /* TOP HEADER */
            .top-bar{
                width: 100%;
                padding: 24px 60px;
                display: flex;
                align-items: center;
                border-bottom: 1px solid rgb(0, 0, 0);
            }
            /* LOGO */
            .logo{
                width: 52px;
                height: 52px;
                object-fit: contain;
                margin-right: 16px;
            }
            /* TEXT */
            .title-box{
                display: flex;
                flex-direction: column;
            }
            .main-title{
                font-size: 28px;
                font-weight: 700;
                letter-spacing: 1px;
                color: #000000;
            }
            .sub-title{
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 2px;
                color: #585e68;
                margin-top: 4px;
            }
            /* MOBILE */
            @media(max-width: 768px){
                .top-bar{
                    padding: 20px;
                }
                .logo{
                    width: 44px;
                    height: 44px;
                }
                .main-title{
                    font-size: 22px;
                }
                .sub-title{
                    font-size: 10px;
                }
            }
     </style>
</head>
<body>

    <!-- HEADER -->
    <header class="top-bar">
        <img src="Cockroach_Janta_Party_logo.png" alt="CJP Logo" class="logo">
        <div class="title-box">
            <h1 class="main-title">Cockroach Janta Party</h1>
            <p class="sub-title">Voice of Lazy & Unemployed</p>
        </div>
    </header>

</body>
</html>
