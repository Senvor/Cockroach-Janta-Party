<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CJP</title>

    <link rel="stylesheet" href="style.css">

     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&display=swap" rel="stylesheet">

     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet">

     <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>

    <header class="top-bar">
        <img src="assests/Cockroach_Janta_Party_logo.png" alt="CJP Logo" class="logo">
        <div class="title-box">
            <h1 class="main-title">Cockroach Janta Party</h1>
            <p class="sub-title">Voice of the Lazy & Unemployed</p>
        </div>
        <a class="origin" href="#origin">
            Origin
        </a>
        <a class="manifesto" href="#manifesto">
            Manifesto
        </a>
        <a class="contact" href="#contact">
            Contact
        </a>
        <a class="join" href="https://cockroachjantaparty.org/#join" target="_blank">
            JOIN NOW
        </a>
    </header>
    
    <section class="info">
        <div class="info-left">
            <p class="info-text">
                A social movement built for the people the
                <span class="system">system</span>
                forgot to
                <span class="count">count.</span>
            </p>
            <div class="info-buttons">
                <a class="volunteer" href="https://cockroachjantaparty.org/volunteer.html" target="_blank">
                    VOLUNTEER
                </a>
                <a class="sack" href="https://petition.cockroachjantaparty.org/sack/">
                    SACK THE EDUCATION MINISTER
                </a>
            </div>
        </div>
        
        <div class="info-right">
            <img src="assests/cockroach.png" alt="Banner">
            <a class="official" href="https://cockroachjantaparty.org/" target="_blank">
                OFFICIAL SITE ↗
            </a>
        </div>
    </section>

</body>
</html>
